{% extends "base.html" %} {% block content %}
<h1 class="h4 mb-4">新增現金紀錄</h1>

<form method="post" action="/cash" class="col-12 col-md-8 col-lg-6">
  <div class="mb-3">
    <label for="taiwanese-dollars" class="form-label">台幣</label>
    <input type="number" min="0" class="form-control" id="taiwanese-dollars" name="taiwanese-dollars" />
  </div>

  <div class="mb-3">
    <label for="us-dollars" class="form-label">美金</label>
    <input type="number" step="0.01" min="0" class="form-control" id="us-dollars" name="us-dollars" />
  </div>

  <div class="mb-3">
    <label for="note" class="form-label">備註</label>
    <input type="text" class="form-control" id="note" name="note" />
  </div>

  <div class="mb-3">
    <label for="date" class="form-label">日期</label>
    <input type="date" class="form-control" id="date" name="date" />
  </div>

  <button type="submit" class="btn btn-primary">新增</button>
</form>
{% endblock %}
